services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: patent_horizon
      POSTGRES_PASSWORD: patent_horizon
      POSTGRES_DB: patent_horizon_dev
    ports:
      - "5432:5432"
    volumes:
      - patent_horizon_pgdata:/var/lib/postgresql/data

volumes:
  patent_horizon_pgdata:
